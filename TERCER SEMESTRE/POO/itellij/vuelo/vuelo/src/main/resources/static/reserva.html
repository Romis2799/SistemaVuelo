<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Sistema de Vuelos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
    <!-- HEADER -->
    <div class="page-header" style="display: flex; align-items: center; gap: 10%; text-align: left; margin-bottom: 40px;">
        <a href="index.html">
            <img src="img/RAM.png" alt="RAM Tech Travel" style="height: 80px; width: auto;  padding: 6px;" >
        </a>
        <div >
            <h1><span>Reserva</span> de vuelos</h1>
        </div>
    </div>

    <!-- PASOS -->
    <div class="pasos">
        <div class="paso activo" id="pasoIndicador1">
            <div class="paso-numero">1</div>
            <span>Usuario</span>
        </div>
        <div class="separador"></div>
        <div class="paso" id="pasoIndicador2">
            <div class="paso-numero">2</div>
            <span>Vuelo</span>
        </div>
        <div class="separador"></div>
        <div class="paso" id="pasoIndicador3">
            <div class="paso-numero">3</div>
            <span>Pago</span>
        </div>
        <div class="separador"></div>
        <div class="paso" id="pasoIndicador4">
            <div class="paso-numero">4</div>
            <span>Confirmación</span>
        </div>
    </div>

    <!-- PASO 1: Buscar usuario -->
    <div id="paso1" class="card" style="max-width: 500px; margin: 0 auto;">
        <h3 style="color: #F72585; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
            <img src="img/usuario.png" style="width: 24px; height: 24px;"> Identificación del Usuario
        </h3>
        <div class="form-group">
            <label>Ingresá tu DNI</label>
            <input type="number" id="dniReserva" placeholder="Ej: 12345678">
        </div>
        <button class="btn btn-reserva" id="btnBuscar" onclick="buscarUsuarioReserva()">Continuar</button>
        <div class="mensaje-error" id="errorPaso1"></div>
    </div>

    <!-- PASO 1B: Registrar usuario nuevo -->
    <div id="paso1b" class="resultado" style="max-width: 500px; margin: 0 auto;">
        <h3>➕ Usuario no encontrado — Registrar</h3>
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="regNombre" placeholder="Nombre">
        </div>
        <div class="form-group">
            <label>Apellido</label>
            <input type="text" id="regApellido" placeholder="Apellido">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="Email">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="regPassword" placeholder="Contraseña">
        </div>
        <button class="btn btn-reserva" onclick="registrarUsuarioReserva()">Registrar y Continuar</button>
        <div class="mensaje-error" id="errorRegistroReserva"></div>
    </div>

    <!-- PASO 2: Elegir vuelo -->
    <div id="paso2" class="resultado" style="max-width: 600px; margin: 0 auto;">
        <h3> <img src="img/avion.png" style="width: 24px; height: 24px;">Selección del Vuelo</h3>
        <p style="color: #a8a8b3; margin-bottom: 20px;">Usuario: <strong id="nombreUsuarioReserva"></strong></p>

        <div class="form-group">
            <label>Origen</label>
            <select id="selectOrigen" onchange="cargarDestinos()">
                <option value="">Seleccioná el origen</option>
            </select>
        </div>
        <div class="form-group">
            <label>Destino</label>
            <select id="selectDestino" onchange="cargarVuelos()" disabled>
                <option value="">Primero seleccioná origen</option>
            </select>
        </div>
        <div class="form-group">
            <label>Vuelo disponible</label>
            <select id="selectVuelo" onchange="cargarAsientos()" disabled>
                <option value="">Primero seleccioná destino</option>
            </select>
        </div>
        <div class="form-group">
            <label>Asiento</label>
            <select id="selectAsiento" disabled>
                <option value="">Primero seleccioná vuelo</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tarifa</label>
            <select id="selectTarifa" disabled>
                <option value="">Primero seleccioná asiento</option>
            </select>
        </div>

        <button class="btn btn-reserva" onclick="irPaso3()">Continuar al Pago</button>
        <div class="mensaje-error" id="errorPaso2"></div>
    </div>

    <!-- PASO 3: Pago -->
    <div id="paso3" class="resultado" style="max-width: 500px; margin: 0 auto;">
        <h3><img src="img/tarjeta.png" style="width: 24px; height: 24px;"> Datos de Pago</h3>
        <div class="form-group">
            <label>Número de Tarjeta</label>
            <input type="number" id="nroTarjeta" placeholder="Ej: 4578454125896321">
        </div>
        <div class="form-group">
            <label>Tipo de Tarjeta</label>
            <select id="tipoTarjeta">
                <option value="">Seleccioná el tipo</option>
                <option value="DEBITO">Débito</option>
                <option value="CREDITO">Crédito</option>
            </select>
        </div>
        <button class="btn btn-consulta" onclick="volverPaso2()"
                style="margin-bottom: 10px; width: 100%;">← Volver</button>
        <button class="btn btn-reserva" onclick="confirmarReserva()">Confirmar Reserva</button>
        <div class="mensaje-error" id="errorPaso3"></div>
    </div>

    <!-- PASO 4: Confirmación -->
    <div id="paso4" class="resultado" style="max-width: 600px; margin: 0 auto;">
        <h3 style="color: #4caf50;">
            <img src="img/aprobado.png" style="width: 24px; height: 24px;"> Reserva Confirmada!</h3>
        <div id="resumenReserva"></div>
        <button class="btn btn-consulta" style="margin-top: 20px;"
                onclick="window.location.href='index.html'">Volver al Inicio</button>
    </div>
</div>
<!-- FOOTER -->
<footer class="footer">
    © 2026 <span>RAM Tech Travel</span> — Todos los derechos reservados
</footer>

<script src="js/reserva.js"></script>
</body>
</html>
