<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta - RAM Tech Travel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header" style="display: flex; align-items: center; gap: 10%; text-align: left; margin-bottom: 40px;">
        <a href="index.html">
            <img src="img/RAM.png" alt="RAM Tech Travel" style="height: 80px; width: auto;  padding: 6px;">
        </a>
        <div >
            <h1><span>Consulta</span> de Reservas</h1>
            <p>Ingresá tu DNI para ver tus vuelos reservados</p>
        </div>
    </div>

    <!-- BUSCAR POR DNI -->
    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <h3 style="color: #F72585; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
            <img src="img/usuario.png" style="width: 24px; height: 24px;"> Identificación
        </h3>
        <div class="form-group">
            <label>DNI</label>
            <input type="number" id="inputDni" placeholder="Ej: 12345678">
        </div>
        <button class="btn btn-primary" id="btnBuscar" onclick="buscarUsuario()">
            <img src="img/consulta.png" style="width: 20px; height: 20px; filter: brightness(10);"> Buscar
        </button>
        <div class="mensaje-error" id="errorBusqueda"></div>
    </div>

    <!-- RESULTADO: Usuario encontrado -->
    <div class="resultado" id="resultadoUsuario" style="max-width: 600px; margin: 25px auto 0;">
        <h3>
            <img src="img/usuario.png"> Datos del Pasajero
        </h3>
        <div class="dato-fila">
            <span class="dato-label">DNI</span>
            <span class="dato-valor" id="usuarioDni"></span>
        </div>
        <div class="dato-fila">
            <span class="dato-label">Nombre</span>
            <span class="dato-valor" id="usuarioNombre"></span>
        </div>
        <div class="dato-fila">
            <span class="dato-label">Apellido</span>
            <span class="dato-valor" id="usuarioApellido"></span>
        </div>
        <div class="dato-fila">
            <span class="dato-label">Email</span>
            <span class="dato-valor" id="usuarioEmail"></span>
        </div>

        <h3 style="margin-top: 25px;">
            <img src="img/reserva.png"> Mis Reservas
        </h3>
        <div id="listaReservas"></div>
    </div>

    <!-- FORMULARIO: Usuario no encontrado -->
    <div class="resultado" id="formNuevoUsuario" style="max-width: 500px; margin: 25px auto 0;">
        <h3>
            <img src="img/usuario.png"> Registrar nuevo pasajero
        </h3>
        <div class="form-group">
            <label>DNI</label>
            <input type="number" id="nuevoDni" placeholder="DNI">
        </div>
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="nuevoNombre" placeholder="Nombre">
        </div>
        <div class="form-group">
            <label>Apellido</label>
            <input type="text" id="nuevoApellido" placeholder="Apellido">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="nuevoEmail" placeholder="Email">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="nuevoPassword" placeholder="Contraseña">
        </div>
        <button class="btn btn-primary" onclick="registrarUsuario()">
            <img src="img/usuario.png" style="width: 20px; height: 20px; filter: brightness(10);"> Registrar
        </button>
        <div class="mensaje-error" id="errorRegistro"></div>
        <div class="mensaje-exito" id="exitoRegistro"></div>
    </div>

</div>

<!-- FOOTER -->
<footer class="footer">
    © 2026 <span>RAM Tech Travel</span> — Todos los derechos reservados
</footer>

<script src="js/consulta.js"></script>
</body>
</html>
