<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAM Tech Travel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>


<div class="container">

    <!-- HEADER -->
    <div class="page-header" style="display: flex; align-items: center; gap: 30px; text-align: left;">
        <img src="img/RAM.png" alt="RAM Tech Travel" style="height: 140px; width: auto; background-color: #FFF1F1; border-radius: 12px; padding: 6px;">
        <div>
            <h1>Bienvenido a <span>RAM Tech Travel</span></h1>
            <p>Tu agencia de viajes online. Consultá y reservá tu vuelo en minutos.</p>
        </div>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <div class="menu-principal">

        <div class="card" onclick="window.location.href='consulta.html'">
            <img src="img/consulta.png" alt="Consulta" class="card-icon">
            <h2>Consulta</h2>
            <p>Buscá tus reservas y vuelos por DNI</p>
            <button class="btn btn-secondary">
                Ver mis reservas
            </button>
        </div>

        <div class="card" onclick="window.location.href='reserva.html'">
            <img src="img/reserva.png" alt="Reserva" class="card-icon">
            <h2>Reserva</h2>
            <p>Elegí tu destino y reservá tu próximo vuelo</p>
            <button class="btn btn-primary">
                Reservar vuelo
            </button>
        </div>

    </div>

</div>

<!-- FOOTER -->
<footer class="footer">
    © 2026 <span>RAM Tech Travel</span> — Todos los derechos reservados
</footer>

</body>
</html>
