<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vuelos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
    <header>
        <h1> Sistema de Reserva de Vuelos</h1>
        <p>Bienvenido al sistema de gestión de vuelos</p>
    </header>

    <main class="menu-principal">
        <div class="card" onclick="window.location.href='consulta.html'">
            <div class="card-icon">🔍</div>
            <h2>Consulta</h2>
            <p>Consultá tus vuelos y reservas por DNI</p>
            <button class="btn btn-consulta">Ir a Consulta</button>
        </div>

        <div class="card" onclick="window.location.href='reserva.html'">
            <div class="card-icon">🎫</div>
            <h2>Reserva</h2>
            <p>Realizá una nueva reserva de vuelo</p>
            <button class="btn btn-reserva">Ir a Reserva</button>
        </div>
    </main>
</div>
</body>
</html>
